<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الملفات</title>
    <style>
        body { font-family: sans-serif; background: #e5ddd5; margin: 0; padding: 10px; }
        #chat-container { max-width: 500px; margin: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 10px; max-width: 80%; margin-bottom: 5px; }
        .bot { background: #fff; align-self: flex-start; }
        .user { background: #dcf8c6; align-self: flex-end; }
        .btn-option { display: block; margin: 5px 0; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        .file-link { color: #007bff; text-decoration: underline; display: block; margin-top: 5px; }
        #active-result { margin-top: 10px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="message bot">أهلاً بك! اختر القسم للمتابعة:</div>
    
    <div id="options-area">
        <button class="btn-option" onclick="showSubFiles('320')">قسم 320</button>
        <button class="btn-option" onclick="showSubFiles('330')">قسم 330</button>
    </div>

    <div id="active-result"></div>
</div>

<script>
    // هيكل البيانات: القسم -> الملفات
    // الملف يتكون من اسم ورابط (URL)
    const filesData = {
        '320': [
            { name: 'ملف المخططات', url: 'files/320_plan.pdf' },
            { name: 'ملف الصيانة', url: 'files/320_fix.pdf' }
        ],
        '330': [
            { name: 'دليل المستخدم', url: 'files/330_guide.pdf' }
        ]
    };

    function showSubFiles(category) {
        const resultArea = document.getElementById('active-result');
        const files = filesData[category];

        if (files) {
            let listHtml = files.map(file => 
                `<a href="${file.url}" target="_blank" class="file-link">📁 ${file.name}</a>`
            ).join('');

            resultArea.innerHTML = `
                <div class="message user">اخترت: ${category}</div>
                <div class="message bot">
                    <b>الملفات المتاحة في ${category}:</b><br>
                    ${listHtml}
                </div>
            `;
        }
    }
</script>

</body>
</html>
