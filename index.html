<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الملفات</title>
    <style>
        body { font-family: sans-serif; background: #e5ddd5; margin: 0; padding: 10px; }
        #chat-container { max-width: 500px; margin: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 10px; max-width: 80%; margin-bottom: 5px; }
        .bot { background: #fff; align-self: flex-start; }
        .user { background: #dcf8c6; align-self: flex-end; }
        .btn-option { display: block; margin: 5px 0; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        #active-result { margin-top: 10px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="message bot">مرحباً! يرجى اختيار القسم المطلوب للاطلاع على ملفاته:</div>
    
    <div id="options-area">
        <button class="btn-option" onclick="showFiles('320')">عرض ملفات 320</button>
        <button class="btn-option" onclick="showFiles('330')">عرض ملفات 330</button>
        <button class="btn-option" onclick="showFiles('777')">عرض ملفات 777</button>
        <button class="btn-option" onclick="showFiles('787')">عرض ملفات 787</button> </div>

    <div id="active-result"></div>
</div>

<script>
    // لتحديث البيانات مستقبلاً، فقط عدل هذا الجزء
    const filesData = {
        '320': ['ملف 320 - رقم 1', 'ملف 320 - رقم 2'],
        '330': ['تقرير 330 - أ', 'تقرير 330 - ب'],
        '777': ['بيانات 777 - الأساسي'],
        '787': ['ملف 787 - الأول', 'ملف 787 - الثاني'] // تمت إضافة بيانات القسم هنا
    };

    function showFiles(category) {
        const resultArea = document.getElementById('active-result');
        
        // التحقق من وجود بيانات للقسم
        if(filesData[category]) {
            resultArea.innerHTML = `
                <div class="message user">اخترت: ${category}</div>
                <div class="message bot">
                    <b>الملفات المتاحة في ${category}:</b><br>
                    ${filesData[category].map(file => `• ${file}<br>`).join('')}
                </div>
            `;
        }
    }
</script>

</body>
</html>
